name: Bass Root Accuracy Regression

on:
  workflow_dispatch:
  push:
    branches: [experiment/real-ui-screenshot, restore-from-dev69]
    paths:
      - 'ai_worker.py'
      - 'tests/test_bass_root_regression.py'
      - 'tests/test_tempo_pitch.py'
      - '.github/workflows/bass-root-regression.yml'

permissions:
  contents: read

jobs:
  bass-root-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install "numpy>=1.26,<3" "librosa>=0.10,<1" "scipy>=1.11,<2" "soundfile>=0.12,<1" "imageio-ffmpeg>=0.5,<1"
      - name: Run seven known-note regression recordings
        run: python -m unittest discover -s tests -p 'test_bass_root_regression.py' -v
      - name: Check FFmpeg tempo change preserves pitch on synthetic audio
        run: python tests/test_tempo_pitch.py
