name: Build RiffLab UI Test for Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main, experiment/real-ui-screenshot]
    paths:
      - 'app.py'
      - '.github/workflows/windows-ui-test.yml'
  push:
    branches: [main, experiment/real-ui-screenshot]
    paths:
      - 'app.py'
      - 'ai_worker.py'
      - 'realtime_audio.py'
      - 'requirements-*.txt'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required source files
        shell: pwsh
        run: |
          foreach ($file in @('app.py','ai_worker.py','realtime_audio.py','requirements-preview.txt','requirements-full.txt')) {
            if (!(Test-Path $file)) { throw "Missing $file. Upload the RiffLab 1.3.7 source files first." }
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements-preview.txt
            requirements-full.txt

      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # Chocolatey puts shim launchers on PATH; never package those shims.
          # Resolve the actual binaries under the installed package directory.
          $packageRoot = 'C:\\ProgramData\\chocolatey\\lib'
          $ffmpeg = Get-ChildItem $packageRoot -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]ffmpeg.exe$' } |
            Sort-Object FullName | Select-Object -First 1
          if (!$ffmpeg) { throw 'Actual FFmpeg binary not found under Chocolatey packages' }
          $ffprobePath = Join-Path $ffmpeg.Directory.FullName 'ffprobe.exe'
          if (!(Test-Path $ffprobePath)) { throw "FFprobe missing next to $($ffmpeg.FullName)" }
          New-Item -ItemType Directory -Force vendor/bin | Out-Null
          Copy-Item $ffmpeg.FullName vendor/bin/ffmpeg.exe
          Copy-Item $ffprobePath vendor/bin/ffprobe.exe
          foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
            $output = & (Join-Path 'vendor/bin' $tool) -version
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "Actual $tool failed with exit code $code" }
            $output | Select-Object -First 1
          }

      - name: Install UI and build tools
        run: python -m pip install -r requirements-preview.txt "pyinstaller>=6.10,<7"

      - name: Build UI executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name RiffLab --add-data "assets/rifflab-logo.svg;assets" --collect-all qtawesome --collect-all yt_dlp app.py
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }

      - name: Install AI requirements
        run: python -m pip install -r requirements-full.txt

      - name: Build AI worker executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --console --onedir --name RiffLabAI --collect-all demucs --collect-all librosa --collect-all torch --collect-all torchaudio --collect-all soundfile --collect-all numba --collect-all scipy --collect-all sklearn --collect-all soxr ai_worker.py
          if ($LASTEXITCODE -ne 0) { throw 'AI worker build failed' }

      - name: Smoke-test packaged AI analysis
        shell: pwsh
        run: |
          @'
          import math, wave, struct
          with wave.open('test-analysis.wav', 'wb') as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(11025)
              for i in range(22050):
                  f.writeframesraw(struct.pack('<h', int(5000 * math.sin(2 * math.pi * 220 * i / 11025))))
          '@ | python -
          $worker = 'dist/RiffLabAI/RiffLabAI.exe'
          $result = & $worker beats test-analysis.wav 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Packaged AI beats analysis failed: $result" }
          $resultText = ($result | Out-String).Trim()
          try { $parsed = $resultText | ConvertFrom-Json -ErrorAction Stop }
          catch { throw "Packaged AI returned invalid JSON: $resultText" }
          if ($null -eq $parsed.beats) { throw "Packaged AI beats result missing: $resultText" }
          $result = & $worker bass_notes test-analysis.wav balanced 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Packaged AI bass analysis failed: $result" }
          $resultText = ($result | Out-String).Trim()
          try { $null = $resultText | ConvertFrom-Json -ErrorAction Stop }
          catch { throw "Packaged AI bass analysis invalid JSON: $resultText" }

      - name: Assemble portable app
        shell: pwsh
        run: |
          $root = 'dist/RiffLab'
          if (!(Test-Path "$root/RiffLab.exe")) { throw 'RiffLab.exe missing' }
          if (!(Test-Path 'dist/RiffLabAI/RiffLabAI.exe')) { throw 'RiffLabAI.exe missing' }
          Copy-Item 'dist/RiffLabAI' "$root/RiffLabAI" -Recurse -Force
          New-Item -ItemType Directory -Force "$root/bin" | Out-Null
          Copy-Item vendor/bin/ffmpeg.exe "$root/bin/ffmpeg.exe"
          Copy-Item vendor/bin/ffprobe.exe "$root/bin/ffprobe.exe"
          foreach ($tool in @('ffmpeg.exe','ffprobe.exe')) {
            $path = Join-Path "$root/bin" $tool
            if (!(Test-Path $path)) { throw "Missing bundled tool: $path" }
            $versionOutput = & $path -version
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) { throw "Bundled tool cannot run: $path (exit code $exitCode)" }
            $versionOutput | Select-Object -First 1
          }
          # Verify the same directory passed to yt-dlp is functional.
          $ffmpegLocation = (Resolve-Path "$root/bin").Path
          @'
          import os
          from yt_dlp.postprocessor.ffmpeg import FFmpegPostProcessor
          location = os.environ['RIFFLAB_FFMPEG_LOCATION']
          p = FFmpegPostProcessor(None)
          p._ffmpeg_location.set(location) if hasattr(p._ffmpeg_location, 'set') else None
          assert os.path.isfile(os.path.join(location, 'ffmpeg.exe'))
          assert os.path.isfile(os.path.join(location, 'ffprobe.exe'))
          '@ | Set-Content verify_ffmpeg.py
          $env:RIFFLAB_FFMPEG_LOCATION = $ffmpegLocation
          python verify_ffmpeg.py
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg location smoke test failed' }
          'Run RiffLab.exe. Keep all files in this folder together.' | Set-Content "$root/START-HERE.txt"
          Compress-Archive -Path "$root/*" -DestinationPath RiffLab-UI-Test-Flat-Chords.zip -Force

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: RiffLab-UI-Test-Flat-Chords
          path: RiffLab-UI-Test-Flat-Chords.zip
          retention-days: 30
