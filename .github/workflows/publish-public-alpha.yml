name: Publish RiffLab Public Alpha
on:
  push:
    branches: [feature/dev85-rebuild]
    paths: ['.github/workflows/publish-public-alpha.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows build 91
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh run download 38947130208 --repo stevieblitz/Rifflab --name RiffLab-Complete-91 --dir release-files
          test -s release-files/RiffLab-Complete-91.zip
          unzip -t release-files/RiffLab-Complete-91.zip >/dev/null
          mv release-files/RiffLab-Complete-91.zip release-files/RiffLab-Windows-v0.2.0-alpha.1.zip
      - name: Publish pre-release and attach complete Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          # RiffLab Alpha v0.2.0 — Windows
          
          First public alpha release from the current RiffLab development series. Built from the successful Windows build #91 (`dccb0e0`). This is experimental software: features, UI and analysis results may change.
          
          ## Highlights
          - Audio import, saved projects and searchable song Library with drag-and-drop.
          - AI stem separation and per-stem mixer with volume, mute and solo.
          - Bass/root-note and chord analysis with a continuous note timeline.
          - Playback, looping, BPM adjustment, waveform seeking and independent H/V grid zoom.
          - Chromatic tuner, tuning guide, Play Along, and accessible Import / Export.
          - Refined dark interface, compact notes/chords switch, original RiffLab branding.
          
          ## Changelog — changes since Alpha v0.1.0
          - Rebuilt the Play Along workspace with a streamlined dark interface and outlined panels.
          - Added the song Library with search, favorites, editable metadata, drag-and-drop, and compact cyan action icons.
          - Added AI stem separation and a dedicated stem mixer with independent volume, mute, and solo.
          - Improved bass/root tracking, including chromatic semitone changes, and added configurable NoteGuard filtering.
          - Updated note/chord recognition with repeated-riff stabilization and reference comparison tools.
          - Replaced detached beat cells with continuous sustained note bars and progress fill.
          - Added waveform seeking, loop IN/OUT markers, BPM controls, and separate horizontal/vertical grid zoom.
          - Added chromatic tuner, instrument tuning guide, and workspace/project persistence.
          - Improved bundled Windows dependencies, automated checks, and startup validation.
          - Refined compact navigation, analysis controls, grid ruler, and mixer/library layout.
          
          ## Windows installation
          1. Download **RiffLab-Windows-v0.2.0-alpha.1.zip** below.
          2. Extract the **entire** ZIP into a folder.
          3. Run **RiffLab.exe**, keeping the `RiffLabAI` and `bin` folders alongside it.
          4. First-time stem separation may download AI model weights and can take time.
          
          This package was produced by GitHub Actions with syntax, dependency, regression and Windows startup checks. Real-world audio detection accuracy and full manual Windows UI testing are not guaranteed. Only analyze audio you are allowed to use.
          
          ## Credits
          **RiffLab by Stevieblitz [Teun Verhoeven]**  
          https://teunverhoeven.nl
          
          Built with open-source audio/AI tooling and AI-assisted development.
          NOTES
          if gh release view v0.2.0-alpha.1 --repo stevieblitz/Rifflab >/dev/null 2>&1; then
            gh release edit v0.2.0-alpha.1 --repo stevieblitz/Rifflab --notes-file release-notes.md --prerelease
            gh release upload v0.2.0-alpha.1 release-files/RiffLab-Windows-v0.2.0-alpha.1.zip --repo stevieblitz/Rifflab --clobber
          else
            gh release create v0.2.0-alpha.1 release-files/RiffLab-Windows-v0.2.0-alpha.1.zip \
              --repo stevieblitz/Rifflab \
              --target dccb0e0d826693694c32af373fa7edcaa64b3722 \
              --title "RiffLab Alpha v0.2.0 — Windows" \
              --prerelease --notes-file release-notes.md
          fi
