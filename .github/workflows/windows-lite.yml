name: Build RiffLab Complete for Windows
# Build request: updated compact UI and visible advanced controls.

# One Windows build per branch. New commits cancel obsolete queued/running
# builds; avoid duplicate push + pull_request builds for the same revision.
on:
  workflow_dispatch:
  push:
    branches: [feature/dev85-rebuild]
    paths:
      - 'app.py'
      - '.github/workflows/windows-lite.yml'
      - 'ai_worker.py'
      - 'realtime_audio.py'
      - 'requirements-*.txt'
      - '.github/workflows/windows-ui-test.yml'
      - 'BUILD_COMPACT.txt'
      - 'autocue.py'
      - 'autocue_widget.py'
      - 'chord_comparison.py'
      - 'test_chord_comparison.py'
      - 'qtawesome_runtime_hook.py'

concurrency:
  group: rifflab-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required source files
        shell: pwsh
        run: |
          foreach ($file in @('app.py','ai_worker.py','realtime_audio.py','requirements-preview.txt','requirements-full.txt')) {
            if (!(Test-Path $file)) { throw "Missing $file. Upload the RiffLab 1.3.7 source files first." }
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements-preview.txt
            requirements-full.txt

      - name: Install FFmpeg and FFprobe (direct download with mirrors)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Avoid Chocolatey's occasionally failing NuGet V2 feed (HTTP 504).
          # Fetch portable, standalone executables, not Chocolatey shims.
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          )
          New-Item -ItemType Directory -Force vendor/bin | Out-Null
          $installed = $false
          foreach ($source in $sources) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading portable FFmpeg from $source (attempt $attempt/3)"
                $zip = Join-Path $env:RUNNER_TEMP 'riff-ffmpeg.zip'
                $unpack = Join-Path $env:RUNNER_TEMP 'riff-ffmpeg-unpack'
                if (Test-Path $zip) { Remove-Item $zip -Force }
                if (Test-Path $unpack) { Remove-Item $unpack -Recurse -Force }
                Invoke-WebRequest -Uri $source -OutFile $zip -MaximumRedirection 10 -TimeoutSec 180
                Expand-Archive -Path $zip -DestinationPath $unpack -Force
                $ffmpeg = Get-ChildItem $unpack -Recurse -File -Filter ffmpeg.exe |
                  Where-Object { $_.Directory.Name -eq 'bin' } |
                  Select-Object -First 1
                if (!$ffmpeg) { throw 'Archive has no bin/ffmpeg.exe' }
                $probe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
                if (!(Test-Path $probe)) { throw 'Archive missing bin/ffprobe.exe' }
                Copy-Item $ffmpeg.FullName vendor/bin/ffmpeg.exe -Force
                Copy-Item $probe vendor/bin/ffprobe.exe -Force
                foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
                  $binary = (Resolve-Path (Join-Path 'vendor/bin' $tool)).Path
                  $versionOutput = & $binary -version 2>&1
                  $exitCode = $LASTEXITCODE
                  if ($exitCode -ne 0) { throw "Executable failed: $tool (exit $exitCode): $versionOutput" }
                  $versionOutput | Select-Object -First 1
                }
                $installed = $true
                break
              } catch {
                Write-Warning "Portable FFmpeg download attempt failed: $_"
                if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
              }
            }
            if ($installed) { break }
          }
          if (!$installed) { throw 'Unable to install portable FFmpeg/FFprobe from either source.' }

      - name: Install UI and build tools
        run: python -m pip install -r requirements-preview.txt "pyinstaller>=6.10,<7"

      - name: Verify Python syntax and label development build
        shell: pwsh
        run: |
          python -m py_compile app.py ai_worker.py realtime_audio.py autocue_widget.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          "BUILD_NUMBER = '${{ github.run_number }}'" | Set-Content -Encoding UTF8 build_info.py

      - name: Validate QtAwesome font resources before packaging
        shell: pwsh
        run: |
          @'
          import os, qtawesome
          from pathlib import Path
          base = Path(qtawesome.__file__).parent / 'fonts'
          print('QtAwesome fonts:', base)
          for path in sorted(base.glob('*.ttf')):
              print(path.name, path.stat().st_size, 'bytes')
              if path.stat().st_size < 1000:
                  raise RuntimeError(f'Empty QtAwesome font: {path}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'QtAwesome resource check failed' }

      - name: Install full AI analysis dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-full.txt
          if ($LASTEXITCODE -ne 0) { throw 'Full AI dependency installation failed' }
          python -c "import demucs, librosa, scipy, torch, soundfile; print('AI dependencies available')"
          if ($LASTEXITCODE -ne 0) { throw 'AI import validation failed' }

      - name: Validate chord-pattern regression tests
        shell: pwsh
        run: |
          python -m py_compile app.py ai_worker.py autocue_widget.py test_chord_patterns.py chord_comparison.py test_chord_comparison.py
          if ($LASTEXITCODE -ne 0) { throw 'Python source syntax check failed' }
          python -m unittest -v test_chord_patterns test_chord_comparison
          if ($LASTEXITCODE -ne 0) { throw 'Chord pattern regression tests failed' }

      - name: Build AI worker
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --console --onedir --name RiffLabAI --collect-all demucs --collect-all librosa --collect-all torch --collect-all torchaudio --collect-all scipy --collect-all soundfile ai_worker.py
          if ($LASTEXITCODE -ne 0) { throw 'AI worker build failed' }
          if (!(Test-Path 'dist/RiffLabAI/RiffLabAI.exe')) { throw 'Missing AI executable' }

      - name: Build UI executable
        shell: pwsh
        run: |
          $assets = @()
          foreach ($file in @('rifflab-logo.svg', 'rifflab-window-icon.png', 'rifflab-brand.png')) {
            if (Test-Path "assets/$file") {
              $assets += @('--add-data', "assets/$file;assets")
            }
          }
          python -m PyInstaller --noconfirm --clean --console --onedir --name RiffLab @assets --collect-all qtawesome --collect-all yt_dlp --hidden-import chord_comparison app.py
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }

      - name: Smoke-test Windows application startup (required)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: |
          @'
          import subprocess, time, os, sys
          exe = os.path.abspath('dist/RiffLab/RiffLab.exe')
          base = os.environ.copy()
          # Only real Windows platform success qualifies a usable Windows build.
          variants = [('windows', {'QT_QPA_PLATFORM':'windows'})]
          success = False
          for label, changes in variants:
              env = base.copy()
              env.update(changes)
              env['QT_DEBUG_PLUGINS'] = '1'
              print('Trying Qt platform:', label, flush=True)
              proc = subprocess.Popen([exe], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              try:
                  time.sleep(5)
                  if proc.poll() is None:
                      success = True
                      print('Startup passed using:', label, flush=True)
                      break
                  stdout, stderr = proc.communicate(timeout=5)
                  print('Exit code:', proc.returncode, flush=True)
                  print('STDOUT:', stdout.decode(errors='replace')[-3000:], flush=True)
                  print('STDERR:', stderr.decode(errors='replace')[-10000:], flush=True)
              finally:
                  if proc.poll() is None:
                      proc.terminate()
                      try: proc.wait(timeout=5)
                      except subprocess.TimeoutExpired: proc.kill()
          if not success:
              print('ERROR: RiffLab.exe failed native Windows startup. No download will be published.', flush=True)
              sys.exit(1)
          '@ | python -

      - name: Package complete Windows download
        shell: pwsh
        run: |
          $root = 'dist/RiffLab'
          if (!(Test-Path "$root/RiffLab.exe")) { throw 'RiffLab.exe missing' }
          if (!(Test-Path 'dist/RiffLabAI/RiffLabAI.exe')) { throw 'Missing AI executable; refusing incomplete package' }
          Copy-Item 'dist/RiffLabAI' (Join-Path $root 'RiffLabAI') -Recurse -Force
          if (!(Test-Path "$root/RiffLabAI/RiffLabAI.exe")) { throw 'Missing AI folder in packaged UI' }
          New-Item -ItemType Directory -Force "$root/bin" | Out-Null
          Copy-Item vendor/bin/ffmpeg.exe "$root/bin/ffmpeg.exe"
          Copy-Item vendor/bin/ffprobe.exe "$root/bin/ffprobe.exe"
          @'
          RiffLab Complete
          1. Run RiffLab.exe.
          2. The RiffLabAI folder is included for stem separation and note analysis.
          3. Keep all files and folders together; AI model weights may download at first use.
          '@ | Set-Content "$root/START-HERE.txt"
          @'
          @echo off
          cd /d "%~dp0"
          set PYTHONFAULTHANDLER=1
          echo Starting RiffLab... > startup-log.txt
          echo Diagnostic launch started: %date% %time%
          RiffLab.exe >> startup-log.txt 2>&1
          set "EXITCODE=%errorlevel%"
          echo Exit code: %EXITCODE% >> startup-log.txt
          echo Exit code: %EXITCODE%
          type startup-log.txt
          echo.
          echo Startup log: %~dp0startup-log.txt
          pause
          '@ | Set-Content "$root/START-DEBUG.bat"
          Compress-Archive -Path "$root/*" -DestinationPath RiffLab-Complete-${{ github.run_number }}.zip -Force
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'RiffLab-Complete-${{ github.run_number }}.zip').Path)
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'RiffLabAI/RiffLabAI.exe' -or $_.FullName -eq 'RiffLabAI\RiffLabAI.exe' })) {
              throw 'AI executable missing from final ZIP'
            }
          } finally { $archive.Dispose() }

      - name: Report actual download size and largest bundled files
        shell: pwsh
        run: |
          $archive = 'RiffLab-Complete-${{ github.run_number }}.zip'
          $zip = Get-Item $archive
          Write-Host ("ZIP download: {0:N1} MB" -f ($zip.Length / 1MB))
          $root = 'dist/RiffLab'
          $total = (Get-ChildItem $root -File -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ("Unpacked installation: {0:N1} MB" -f ($total / 1MB))
          Get-ChildItem $root -File -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 20 @{Name='MB';Expression={[math]::Round($_.Length / 1MB, 1)}}, FullName |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: RiffLab-Complete-${{ github.run_number }}
          path: RiffLab-Complete-${{ github.run_number }}.zip
          retention-days: 30
