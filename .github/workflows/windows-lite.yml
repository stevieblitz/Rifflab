name: Build RiffLab Lite for Windows

# One Windows build per branch. New commits cancel obsolete queued/running
# builds; avoid duplicate push + pull_request builds for the same revision.
on:
  workflow_dispatch:
  push:
    branches: [feature/complexity-slider-test]
    paths:
      - 'app.py'
      - '.github/workflows/windows-lite.yml'
      - 'ai_worker.py'
      - 'realtime_audio.py'
      - 'requirements-*.txt'
      - '.github/workflows/windows-ui-test.yml'

concurrency:
  group: rifflab-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required source files
        shell: pwsh
        run: |
          foreach ($file in @('app.py','ai_worker.py','realtime_audio.py','requirements-preview.txt','requirements-full.txt')) {
            if (!(Test-Path $file)) { throw "Missing $file. Upload the RiffLab 1.3.7 source files first." }
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements-preview.txt
            requirements-full.txt

      - name: Install FFmpeg and FFprobe (direct download with mirrors)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Avoid Chocolatey's occasionally failing NuGet V2 feed (HTTP 504).
          # Fetch portable, standalone executables, not Chocolatey shims.
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          )
          New-Item -ItemType Directory -Force vendor/bin | Out-Null
          $installed = $false
          foreach ($source in $sources) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading portable FFmpeg from $source (attempt $attempt/3)"
                $zip = Join-Path $env:RUNNER_TEMP 'riff-ffmpeg.zip'
                $unpack = Join-Path $env:RUNNER_TEMP 'riff-ffmpeg-unpack'
                if (Test-Path $zip) { Remove-Item $zip -Force }
                if (Test-Path $unpack) { Remove-Item $unpack -Recurse -Force }
                Invoke-WebRequest -Uri $source -OutFile $zip -MaximumRedirection 10 -TimeoutSec 180
                Expand-Archive -Path $zip -DestinationPath $unpack -Force
                $ffmpeg = Get-ChildItem $unpack -Recurse -File -Filter ffmpeg.exe |
                  Where-Object { $_.Directory.Name -eq 'bin' } |
                  Select-Object -First 1
                if (!$ffmpeg) { throw 'Archive has no bin/ffmpeg.exe' }
                $probe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
                if (!(Test-Path $probe)) { throw 'Archive missing bin/ffprobe.exe' }
                Copy-Item $ffmpeg.FullName vendor/bin/ffmpeg.exe -Force
                Copy-Item $probe vendor/bin/ffprobe.exe -Force
                foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
                  $binary = (Resolve-Path (Join-Path 'vendor/bin' $tool)).Path
                  $versionOutput = & $binary -version 2>&1
                  $exitCode = $LASTEXITCODE
                  if ($exitCode -ne 0) { throw "Executable failed: $tool (exit $exitCode): $versionOutput" }
                  $versionOutput | Select-Object -First 1
                }
                $installed = $true
                break
              } catch {
                Write-Warning "Portable FFmpeg download attempt failed: $_"
                if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
              }
            }
            if ($installed) { break }
          }
          if (!$installed) { throw 'Unable to install portable FFmpeg/FFprobe from either source.' }

      - name: Install UI and build tools
        run: python -m pip install -r requirements-preview.txt "pyinstaller>=6.10,<7"

      - name: Verify Python syntax and label development build
        shell: pwsh
        run: |
          python -m py_compile app.py ai_worker.py realtime_audio.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          "BUILD_NUMBER = '${{ github.run_number }}'" | Set-Content -Encoding UTF8 build_info.py

      - name: Build UI executable
        shell: pwsh
        run: |
          $brandArg = @()
          if (Test-Path 'assets/rifflab-brand.png') {
            $brandArg = @('--add-data', 'assets/rifflab-brand.png;assets')
          }
          # Confirmed mapping: the square RL + Erlenmeyer mark is BOTH the
          # Explorer .exe icon and the Qt titlebar icon. Do not use the flask-only asset.
          python -m pip install Pillow
          @'
          from PIL import Image
          source = Image.open('assets/rifflab-window-icon.png').convert('RGBA')
          source.save('assets/rifflab-app.ico', format='ICO',
                      sizes=[(16,16), (24,24), (32,32), (48,48),
                             (64,64), (128,128), (256,256)])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Icon conversion failed' }
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name RiffLab --icon "assets/rifflab-app.ico" --add-data "assets/rifflab-logo.svg;assets" --add-data "assets/rifflab-window-icon.png;assets" @brandArg --collect-all qtawesome --collect-all yt_dlp app.py
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }

      - name: Install AI requirements
        run: python -m pip install librosa soundfile scipy scikit-learn soxr numba

      - name: Build AI worker executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --console --onedir --name RiffLabAI --collect-all librosa --collect-all soundfile --collect-all numba --collect-all scipy --collect-all sklearn --collect-all soxr --exclude-module demucs --exclude-module torch --exclude-module torchaudio ai_worker.py
          if ($LASTEXITCODE -ne 0) { throw 'AI worker build failed' }

      - name: Smoke-test packaged AI analysis
        shell: pwsh
        run: |
          @'
          import math, wave, struct
          with wave.open('test-analysis.wav', 'wb') as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(11025)
              for i in range(22050):
                  f.writeframesraw(struct.pack('<h', int(5000 * math.sin(2 * math.pi * 220 * i / 11025))))
          '@ | python -
          $worker = 'dist/RiffLabAI/RiffLabAI.exe'
          $result = & $worker beats test-analysis.wav 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Packaged AI beats analysis failed: $result" }
          $resultText = ($result | Out-String).Trim()
          try { $parsed = $resultText | ConvertFrom-Json -ErrorAction Stop }
          catch { throw "Packaged AI returned invalid JSON: $resultText" }
          if ($null -eq $parsed.beats) { throw "Packaged AI beats result missing: $resultText" }
          $result = & $worker bass_notes test-analysis.wav balanced 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Packaged AI bass analysis failed: $result" }
          $resultText = ($result | Out-String).Trim()
          try { $null = $resultText | ConvertFrom-Json -ErrorAction Stop }
          catch { throw "Packaged AI bass analysis invalid JSON: $resultText" }

      - name: Assemble portable app
        shell: pwsh
        run: |
          $root = 'dist/RiffLab'
          if (!(Test-Path "$root/RiffLab.exe")) { throw 'RiffLab.exe missing' }
          if (!(Test-Path 'dist/RiffLabAI/RiffLabAI.exe')) { throw 'RiffLabAI.exe missing' }
          Copy-Item 'dist/RiffLabAI' "$root/RiffLabAI" -Recurse -Force
          New-Item -ItemType Directory -Force "$root/bin" | Out-Null
          Copy-Item vendor/bin/ffmpeg.exe "$root/bin/ffmpeg.exe"
          Copy-Item vendor/bin/ffprobe.exe "$root/bin/ffprobe.exe"
          foreach ($tool in @('ffmpeg.exe','ffprobe.exe')) {
            $path = Join-Path "$root/bin" $tool
            if (!(Test-Path $path)) { throw "Missing bundled tool: $path" }
            $versionOutput = & $path -version
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) { throw "Bundled tool cannot run: $path (exit code $exitCode)" }
            $versionOutput | Select-Object -First 1
          }
          # Verify the same directory passed to yt-dlp is functional.
          $ffmpegLocation = (Resolve-Path "$root/bin").Path
          @'
          import os, subprocess
          from yt_dlp import YoutubeDL
          location = os.environ['RIFFLAB_FFMPEG_LOCATION']
          for tool in ('ffmpeg.exe', 'ffprobe.exe'):
              executable = os.path.join(location, tool)
              assert os.path.isfile(executable), executable
              subprocess.run([executable, '-version'], check=True, capture_output=True)
          with YoutubeDL({'ffmpeg_location': location, 'quiet': True}) as ydl:
              pp = __import__('yt_dlp.postprocessor.ffmpeg', fromlist=['FFmpegExtractAudioPP']).FFmpegExtractAudioPP(ydl)
              assert pp.available, 'yt-dlp cannot locate FFmpeg'
              assert pp.probe_available, 'yt-dlp cannot locate FFprobe'
          '@ | Set-Content verify_ffmpeg.py
          $env:RIFFLAB_FFMPEG_LOCATION = $ffmpegLocation
          python verify_ffmpeg.py
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg location smoke test failed' }
          # Re-test the worker from its FINAL location inside the portable
          # app, with the same reset flag used by the UI subprocess launcher.
          $env:PYINSTALLER_RESET_ENVIRONMENT = '1'
          $worker = Join-Path $root 'RiffLabAI/RiffLabAI.exe'
          foreach ($task in @('beats', 'bass_notes')) {
            $argsForTask = if ($task -eq 'beats') { @('beats', 'test-analysis.wav') } else { @('bass_notes', 'test-analysis.wav', 'balanced') }
            $output = & $worker @argsForTask 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "FINAL packaged worker $task failed (exit $code): $output" }
            $json = ($output | Out-String).Trim()
            try { $null = $json | ConvertFrom-Json -ErrorAction Stop }
            catch { throw "FINAL packaged worker $task invalid JSON: $json" }
          }
          Remove-Item Env:PYINSTALLER_RESET_ENVIRONMENT -ErrorAction SilentlyContinue
          'RiffLab Lite: bass/chord analysis available on existing separated audio. New stem separation requires Full edition. Run RiffLab.exe.' | Set-Content "$root/START-HERE.txt"
          Compress-Archive -Path "$root/*" -DestinationPath RiffLab-Lite-Complexity-${{ github.run_number }}.zip -Force

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: RiffLab-Lite-Complexity-${{ github.run_number }}
          path: RiffLab-Lite-Complexity-${{ github.run_number }}.zip
          retention-days: 30
