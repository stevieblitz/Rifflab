name: Build RiffLab Compact for Windows
# Build request: updated compact UI and visible advanced controls.

# One Windows build per branch. New commits cancel obsolete queued/running
# builds; avoid duplicate push + pull_request builds for the same revision.
on:
  workflow_dispatch:
  push:
    branches: [feature/complexity-slider-test]
    paths:
      - 'app.py'
      - '.github/workflows/windows-lite.yml'
      - 'ai_worker.py'
      - 'realtime_audio.py'
      - 'requirements-*.txt'
      - '.github/workflows/windows-ui-test.yml'
      - 'BUILD_COMPACT.txt'
      - 'autocue.py'
      - 'autocue_widget.py'
      - 'qtawesome_runtime_hook.py'
      - 'test_autocue.py'

concurrency:
  group: rifflab-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required source files
        shell: pwsh
        run: |
          foreach ($file in @('app.py','ai_worker.py','realtime_audio.py','requirements-preview.txt','requirements-full.txt')) {
            if (!(Test-Path $file)) { throw "Missing $file. Upload the RiffLab 1.3.7 source files first." }
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements-preview.txt
            requirements-full.txt

      - name: Validate autocue calculations
        shell: pwsh
        run: |
          python -m unittest -v test_autocue.py
          if ($LASTEXITCODE -ne 0) { throw 'Autocue tests failed' }

      - name: Install FFmpeg and FFprobe (direct download with mirrors)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Avoid Chocolatey's occasionally failing NuGet V2 feed (HTTP 504).
          # Fetch portable, standalone executables, not Chocolatey shims.
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          )
          New-Item -ItemType Directory -Force vendor/bin | Out-Null
          $installed = $false
          foreach ($source in $sources) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading portable FFmpeg from $source (attempt $attempt/3)"
                $zip = Join-Path $env:RUNNER_TEMP 'riff-ffmpeg.zip'
                $unpack = Join-Path $env:RUNNER_TEMP 'riff-ffmpeg-unpack'
                if (Test-Path $zip) { Remove-Item $zip -Force }
                if (Test-Path $unpack) { Remove-Item $unpack -Recurse -Force }
                Invoke-WebRequest -Uri $source -OutFile $zip -MaximumRedirection 10 -TimeoutSec 180
                Expand-Archive -Path $zip -DestinationPath $unpack -Force
                $ffmpeg = Get-ChildItem $unpack -Recurse -File -Filter ffmpeg.exe |
                  Where-Object { $_.Directory.Name -eq 'bin' } |
                  Select-Object -First 1
                if (!$ffmpeg) { throw 'Archive has no bin/ffmpeg.exe' }
                $probe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
                if (!(Test-Path $probe)) { throw 'Archive missing bin/ffprobe.exe' }
                Copy-Item $ffmpeg.FullName vendor/bin/ffmpeg.exe -Force
                Copy-Item $probe vendor/bin/ffprobe.exe -Force
                foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
                  $binary = (Resolve-Path (Join-Path 'vendor/bin' $tool)).Path
                  $versionOutput = & $binary -version 2>&1
                  $exitCode = $LASTEXITCODE
                  if ($exitCode -ne 0) { throw "Executable failed: $tool (exit $exitCode): $versionOutput" }
                  $versionOutput | Select-Object -First 1
                }
                $installed = $true
                break
              } catch {
                Write-Warning "Portable FFmpeg download attempt failed: $_"
                if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
              }
            }
            if ($installed) { break }
          }
          if (!$installed) { throw 'Unable to install portable FFmpeg/FFprobe from either source.' }

      - name: Install UI and build tools
        run: python -m pip install -r requirements-preview.txt "pyinstaller>=6.10,<7"

      - name: Verify Python syntax and label development build
        shell: pwsh
        run: |
          python -m py_compile app.py ai_worker.py realtime_audio.py autocue_widget.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          "BUILD_NUMBER = '${{ github.run_number }}'" | Set-Content -Encoding UTF8 build_info.py

      - name: Validate QtAwesome font resources before packaging
        shell: pwsh
        run: |
          @'
          import os, qtawesome
          from pathlib import Path
          base = Path(qtawesome.__file__).parent / 'fonts'
          print('QtAwesome fonts:', base)
          for path in sorted(base.glob('*.ttf')):
              print(path.name, path.stat().st_size, 'bytes')
              if path.stat().st_size < 1000:
                  raise RuntimeError(f'Empty QtAwesome font: {path}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'QtAwesome resource check failed' }

      - name: Confirm runtime hook exists
        shell: pwsh
        run: |
          if (!(Test-Path 'qtawesome_runtime_hook.py')) { throw 'Missing qtawesome_runtime_hook.py in checkout' }
          python -m py_compile qtawesome_runtime_hook.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime hook syntax error' }

      - name: Build UI executable
        shell: pwsh
        run: |
          $brandArg = @()
          if (Test-Path 'assets/rifflab-brand.png') {
            $brandArg = @('--add-data', 'assets/rifflab-brand.png;assets')
          }
          # Confirmed mapping: the square RL + Erlenmeyer mark is BOTH the
          # Explorer .exe icon and the Qt titlebar icon. Do not use the flask-only asset.
          python -m pip install Pillow
          @'
          from PIL import Image
          source = Image.open('assets/rifflab-window-icon.png').convert('RGBA')
          source.save('assets/rifflab-app.ico', format='ICO',
                      sizes=[(16,16), (24,24), (32,32), (48,48),
                             (64,64), (128,128), (256,256)])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Icon conversion failed' }
          python -m PyInstaller --noconfirm --clean --console --onedir --name RiffLab --icon "assets/rifflab-app.ico" --add-data "assets/rifflab-logo.svg;assets" --add-data "assets/rifflab-window-icon.png;assets" @brandArg --collect-all qtawesome --collect-all yt_dlp --runtime-hook qtawesome_runtime_hook.py app.py
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }

      - name: Smoke-test Windows application startup (required)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: |
          @'
          import subprocess, time, os, sys
          exe = os.path.abspath('dist/RiffLab/RiffLab.exe')
          base = os.environ.copy()
          variants = [
              ('offscreen', {'QT_QPA_PLATFORM':'offscreen'}),
              ('minimal', {'QT_QPA_PLATFORM':'minimal'}),
              ('windows', {'QT_QPA_PLATFORM':'windows'})
          ]
          success = False
          for label, changes in variants:
              env = base.copy()
              env.update(changes)
              env['QT_DEBUG_PLUGINS'] = '1'
              print('Trying Qt platform:', label, flush=True)
              proc = subprocess.Popen([exe], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              try:
                  time.sleep(5)
                  if proc.poll() is None:
                      success = True
                      print('Startup passed using:', label, flush=True)
                      break
                  stdout, stderr = proc.communicate(timeout=5)
                  print('Exit code:', proc.returncode, flush=True)
                  print('STDOUT:', stdout.decode(errors='replace')[-3000:], flush=True)
                  print('STDERR:', stderr.decode(errors='replace')[-10000:], flush=True)
              finally:
                  if proc.poll() is None:
                      proc.terminate()
                      try: proc.wait(timeout=5)
                      except subprocess.TimeoutExpired: proc.kill()
          if not success:
              print('ERROR: RiffLab.exe failed all three startup checks. This build is NOT usable.', flush=True)
              sys.exit(1)
          '@ | python -

      - name: Isolate Qt window show crash
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = (Resolve-Path 'dist/RiffLab/RiffLab.exe').Path
          $env:QT_QPA_PLATFORM = 'windows'
          $env:PYTHONFAULTHANDLER = '1'
          foreach ($mode in @('tab-0', 'tab-1', 'tab-2', 'tab-3')) {
            Write-Host "=== DIAGNOSTIC MODE: $mode ==="
            $env:RIFFLAB_DIAG_MODE = $mode
            $out = Join-Path $env:RUNNER_TEMP "riff-$mode-stdout.txt"
            $err = Join-Path $env:RUNNER_TEMP "riff-$mode-stderr.txt"
            $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (!$p.WaitForExit(12000)) {
              Write-Host "ALIVE after 12 seconds (startup passed); terminating diagnostic process"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            } else {
              Write-Host "Exit code: $($p.ExitCode)"
            }
            Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 35
            Remove-Item Env:RIFFLAB_DIAG_MODE -ErrorAction SilentlyContinue
          }

      - name: Capture native Windows crash with ProcDump
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $dumpDir = Join-Path $env:GITHUB_WORKSPACE 'crash-diagnostics'
          New-Item -ItemType Directory -Force $dumpDir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'procdump.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'procdump'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $zip -TimeoutSec 120
          Expand-Archive $zip $unpack -Force
          $procDump = Join-Path $unpack 'procdump64.exe'
          if (!(Test-Path $procDump)) { throw 'ProcDump executable missing' }
          $env:QT_QPA_PLATFORM = 'windows'
          $env:PYTHONFAULTHANDLER = '1'
          $exe = (Resolve-Path 'dist/RiffLab/RiffLab.exe').Path
          "Running ProcDump on $exe" | Set-Content "$dumpDir/diagnostic.txt"
          & $procDump -accepteula -ma -e -x $dumpDir $exe *>> "$dumpDir/procdump-output.txt"
          $exit = $LASTEXITCODE
          "ProcDump exit code: $exit" | Add-Content "$dumpDir/diagnostic.txt"
          Get-ChildItem $dumpDir | Select-Object Name,Length | Format-Table | Out-String | Add-Content "$dumpDir/diagnostic.txt"
          if (!(Get-ChildItem $dumpDir -Filter '*.dmp' -ErrorAction SilentlyContinue)) {
            'No native dump produced by ProcDump.' | Add-Content "$dumpDir/diagnostic.txt"
          }

      - name: Upload native crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiffLab-native-crash-${{ github.run_number }}
          path: crash-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Package small UI download
        shell: pwsh
        run: |
          $root = 'dist/RiffLab'
          if (!(Test-Path "$root/RiffLab.exe")) { throw 'RiffLab.exe missing' }
          New-Item -ItemType Directory -Force "$root/bin" | Out-Null
          Copy-Item vendor/bin/ffmpeg.exe "$root/bin/ffmpeg.exe"
          Copy-Item vendor/bin/ffprobe.exe "$root/bin/ffprobe.exe"
          @'
          RiffLab Compact
          1. Run RiffLab.exe to open the interface and saved analyses.
          2. Install the AI Engine separately once to enable new stem separation and bass/chord analysis.
          3. Keep all files in this folder together.
          '@ | Set-Content "$root/START-HERE.txt"
          @'
          @echo off
          cd /d "%~dp0"
          set PYTHONFAULTHANDLER=1
          echo Starting RiffLab... > startup-log.txt
          echo Diagnostic launch started: %date% %time%
          RiffLab.exe >> startup-log.txt 2>&1
          set "EXITCODE=%errorlevel%"
          echo Exit code: %EXITCODE% >> startup-log.txt
          echo Exit code: %EXITCODE%
          type startup-log.txt
          echo.
          echo Startup log: %~dp0startup-log.txt
          pause
          '@ | Set-Content "$root/START-DEBUG.bat"
          Compress-Archive -Path "$root/*" -DestinationPath RiffLab-Compact-${{ github.run_number }}.zip -Force

      - name: Report actual download size and largest bundled files
        shell: pwsh
        run: |
          $archive = 'RiffLab-Compact-${{ github.run_number }}.zip'
          $zip = Get-Item $archive
          Write-Host ("ZIP download: {0:N1} MB" -f ($zip.Length / 1MB))
          $root = 'dist/RiffLab'
          $total = (Get-ChildItem $root -File -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ("Unpacked installation: {0:N1} MB" -f ($total / 1MB))
          Get-ChildItem $root -File -Recurse |
            Sort-Object Length -Descending |
            Select-Object -First 20 @{Name='MB';Expression={[math]::Round($_.Length / 1MB, 1)}}, FullName |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: RiffLab-Compact-${{ github.run_number }}
          path: RiffLab-Compact-${{ github.run_number }}.zip
          retention-days: 30
