name: Publish RiffLab alpha

on:
  push:
    tags:
      - 'v*-alpha.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag'
        required: true
        default: 'v0.1.0-alpha.1'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh api "repos/${{ github.repository }}/actions/artifacts?name=RiffLab-Windows-Alpha-1.3.7&per_page=100" --jq '.artifacts[] | select(.expired == false) | .id' | head -1 > artifact_id
          test -s artifact_id || { echo "No Windows artifact available"; exit 1; }
          gh api "repos/${{ github.repository }}/actions/artifacts/$(cat artifact_id)/zip" > artifact.zip
          unzip -o artifact.zip -d artifact
          test -f artifact/RiffLab-Windows-Alpha-1.3.7.zip
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Attach Windows ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifact/RiffLab-Windows-Alpha-1.3.7.zip --repo "${{ github.repository }}" --clobber
