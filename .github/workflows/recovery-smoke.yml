name: Recovery UI Smoke Test

on:
  push:
    branches: [restore-from-dev69]
  workflow_dispatch:

jobs:
  qt-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        shell: pwsh
        run: python -m py_compile app.py realtime_audio.py ai_worker.py tests/test_recovery_smoke.py
      - name: Install lightweight Qt dependencies
        run: python -m pip install -r requirements-preview.txt
      - name: Qt startup, note, transpose and stem timing regression checks
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: '*.debug=false'
        run: python tests/test_recovery_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riff-recovery-screenshot
          path: recovery-ui.png
          if-no-files-found: warn
